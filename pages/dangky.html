<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký tài khoản - Trí Tuệ Book</title>
    <link rel="stylesheet" href="../src/css/auth.css">
    <script>
        (function() {
            var m = localStorage.getItem('theme_mode');
            if (m === 'dark' || (!m && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
            }
        })();
    </script>
</head>
<body>

    <button type="button" class="theme-switch-btn" style="position: fixed; top: 20px; right: 20px; z-index: 99;" title="Đổi giao diện Sáng / Tối" aria-label="Đổi giao diện">🌙</button>

    <div class="auth-wrapper">
        <div class="auth-header">
            <a href="../index.html" class="brand-logo-container" title="Trở về trang chủ">
                <img src="/src/assets/logo-light.svg" class="logo-light" alt="Trí Tuệ Book - Sáng">
                <img src="/src/assets/logo-dark.svg" class="logo-dark" alt="Trí Tuệ Book - Tối">
            </a>
            <h1>Tạo Tài Khoản</h1>
            <p>Tham gia cộng đồng bạn đọc Trí Tuệ Book</p>
        </div>

        <form id="registerForm">
            <!-- CHỌN VAI TRÒ TÀI KHOẢN -->
            <div class="form-group">
                <label style="margin-bottom: 8px;">Bạn tham gia với tư cách:</label>
                <div class="role-selector-group" style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                    <label class="role-option-label active" id="labelRoleCustomer" style="display: flex; align-items: center; gap: 8px; padding: 10px 12px; border: 2px solid #4f46e5; background: #eef2ff; border-radius: 10px; cursor: pointer; font-size: 0.88rem; font-weight: 700; color: #4338ca;">
                        <input type="radio" name="accountRole" value="customer" checked style="accent-color: #4f46e5;">
                        <span>👤 Người mua</span>
                    </label>
                    <label class="role-option-label" id="labelRoleSeller" style="display: flex; align-items: center; gap: 8px; padding: 10px 12px; border: 2px solid #e2e8f0; background: #f8fafc; border-radius: 10px; cursor: pointer; font-size: 0.88rem; font-weight: 700; color: #64748b;">
                        <input type="radio" name="accountRole" value="seller" style="accent-color: #10b981;">
                        <span>🏪 Người bán</span>
                    </label>
                </div>
            </div>

            <!-- CÁC TRƯỜNG BỔ SUNG CHO NGƯỜI BÁN (MỞ SHOP) -->
            <div id="sellerExtraFields" style="display: none; padding: 14px; background: rgba(16, 185, 129, 0.06); border: 1px dashed rgba(16, 185, 129, 0.4); border-radius: 12px; margin-bottom: 20px;">
                <div style="font-size: 0.85rem; font-weight: 800; color: #047857; margin-bottom: 12px; display: flex; align-items: center; gap: 6px;">
                    <span>🏪 Thông tin Gian hàng / Nhà sách</span>
                </div>
                <div class="form-group" style="margin-bottom: 12px;">
                    <label for="shopName">Tên Gian hàng / Hiệu sách *</label>
                    <input type="text" id="shopName" placeholder="ví dụ: Tiệm Sách Tuổi Trẻ">
                </div>
                <div class="form-group" style="margin-bottom: 12px;">
                    <label for="shopPhone">Số điện thoại liên hệ *</label>
                    <input type="tel" id="shopPhone" placeholder="ví dụ: 0912 345 678">
                </div>
                <div class="form-group" style="margin-bottom: 0;">
                    <label for="shopAddress">Địa chỉ kho gửi hàng *</label>
                    <input type="text" id="shopAddress" placeholder="ví dụ: 123 Nguyễn Huệ, Q.1, TP.HCM">
                </div>
            </div>

            <div class="form-group">
                <label for="name">Họ và tên người đại diện</label>
                <input
                    type="text"
                    id="name"
                    placeholder="ví dụ: Nguyễn Văn A"
                    required
                >
            </div>

            <div class="form-group">
                <label for="email">Địa chỉ Email</label>
                <input
                    type="email"
                    id="email"
                    placeholder="ví dụ: a@example.com"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Mật khẩu</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Nhập mật khẩu (ít nhất 6 ký tự)"
                    required
                >
            </div>

            <div class="form-group">
                <label for="confirmPassword">Xác nhận mật khẩu</label>
                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Nhập lại mật khẩu phía trên"
                    required
                >
            </div>

            <button type="submit" class="auth-btn">
                Tạo tài khoản
            </button>
        </form>

        <p id="registerMessage" class="message"></p>
        <p id="message" style="display: none;"></p>

        <div class="auth-footer">
            Đã có tài khoản? <a href="login.html">Đăng nhập ngay</a>
        </div>

        <a href="../index.html" class="back-home">
            ← Trở về trang chủ
        </a>
    </div>

    <script type="module" src="../src/js/register.js"></script>
</body>
</html>
