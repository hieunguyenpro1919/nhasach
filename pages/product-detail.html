<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi tiết sách - Trí Tuệ Book</title>
    <link rel="stylesheet" href="../src/css/detail.css">
    <link rel="stylesheet" href="../src/css/chatbot.css">
    <script>
        (function() {
            var m = localStorage.getItem('theme_mode');
            if (m === 'dark' || (!m && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
            }
        })();
    </script>
</head>
<body>

    <!-- HEADER -->
    <header class="header">
        <div class="container header-inner">
            <a href="../index.html" class="brand-logo-container">
                <img src="/src/assets/logo-light.svg" class="logo-light" alt="Trí Tuệ Book - Sáng">
                <img src="/src/assets/logo-dark.svg" class="logo-dark" alt="Trí Tuệ Book - Tối">
            </a>
            <div class="header-nav">
                <button type="button" class="theme-switch-btn" title="Đổi giao diện Sáng / Tối" aria-label="Đổi giao diện">🌙</button>
                <div class="notification-bell-wrap" id="headerNotificationBell" style="display: none;">
                    <button type="button" class="btn-notification-bell" title="Thông báo đơn hàng" aria-label="Thông báo">
                        🔔
                        <span class="notification-badge" style="display: none;">0</span>
                    </button>
                    <div class="notification-dropdown hidden">
                        <div class="notification-dropdown-header">
                            <h4><span>🔔</span> Thông báo đơn hàng</h4>
                            <button type="button" class="btn-mark-all-read">Đã đọc tất cả</button>
                        </div>
                        <div class="notification-list"></div>
                        <div class="notification-dropdown-footer">
                            <a href="./orders.html">Xem đơn hàng của bạn →</a>
                        </div>
                    </div>
                </div>
                <a href="./profile.html" class="back-link" title="Xem hồ sơ cá nhân">
                    👤 Hồ sơ
                </a>
                <a href="./wishlist.html" class="back-link" title="Xem sách yêu thích" style="color: #ef4444; font-weight: 700;">
                    ❤️ Yêu thích
                </a>
                <a href="./cart.html" class="back-link" title="Xem giỏ hàng" style="background: #eef2ff; color: #4f46e5; font-weight: 700;">
                    🛒 Giỏ hàng (<span id="cartCount">0</span>)
                </a>
                <a href="../index.html" class="back-link">
                    ← Quay lại trang chủ
                </a>
            </div>
        </div>
    </header>

    <!-- MAIN DETAIL -->
    <main>
        <div class="container">
            <div id="loading" class="loading">
                ⏳ Đang tải thông tin chi tiết cuốn sách...
            </div>

            <div id="error" class="error hidden">
                ⚠️ Không tìm thấy thông tin cuốn sách này hoặc liên kết không hợp lệ.
            </div>

            <div id="productDetail" class="product-detail">
                <!-- Sẽ được render bởi detail.js -->
            </div>
        </div>
    </main>

    <script type="module" src="../src/js/detail.js"></script>
</body>
</html>
