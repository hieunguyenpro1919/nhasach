<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 60" width="100%" height="100%">
  <defs>
    <!-- Chuyển sắc vũ trụ kỳ ảo: Cyan - Neon Violet - Solar Gold -->
    <linearGradient id="cosmicGradDark" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#FDE047"/>
    </linearGradient>

    <!-- Trang sách cánh trái ánh cyan neon -->
    <linearGradient id="bookLeftDark" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Trang sách cánh phải ánh tím vũ trụ -->
    <linearGradient id="bookRightDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Bộ lọc phát sáng cực quang dịu êm -->
    <filter id="cosmicGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- BIỂU TƯỢNG BÊN TRÁI: NGÔI SAO BẮC ĐẨU TRI THỨC & CUỐN SÁCH KHÔNG GIAN -->
  <g id="brand-icon-dark">
    <!-- Hai quỹ đạo tinh vân bao quanh -->
    <ellipse cx="28" cy="20" rx="19" ry="6" fill="none" stroke="url(#cosmicGradDark)" stroke-width="1.2" stroke-dasharray="3 2" opacity="0.65" transform="rotate(-18, 28, 20)"/>
    <ellipse cx="28" cy="20" rx="19" ry="6" fill="none" stroke="url(#cosmicGradDark)" stroke-width="0.9" stroke-dasharray="4 2" opacity="0.45" transform="rotate(26, 28, 20)"/>

    <!-- Các vì tinh tú li ti -->
    <circle cx="15" cy="14" r="1" fill="#00F0FF" opacity="0.9"/>
    <circle cx="41" cy="13" r="1.2" fill="#FDE047" opacity="0.9"/>
    <circle cx="24" cy="8" r="0.8" fill="#FFFFFF" opacity="0.75"/>
    <circle cx="33" cy="7" r="1" fill="#A855F7" opacity="0.85"/>

    <!-- Ngôi sao 8 cánh phát sáng tỏa rạng -->
    <circle cx="28" cy="20" r="4.5" fill="#8B5CF6" opacity="0.4" filter="url(#cosmicGlow)"/>
    <path d="M 28 8 L 30 17.5 L 39 20 L 30 22.5 L 28 32 L 26 22.5 L 17 20 L 26 17.5 Z" fill="url(#cosmicGradDark)" filter="url(#cosmicGlow)"/>
    <path d="M 28 13 L 29.2 18.2 L 34 20 L 29.2 21.8 L 28 27 L 26.8 21.8 L 22 20 L 26.8 18.2 Z" transform="rotate(45, 28, 20)" fill="#FFFFFF" opacity="0.85"/>
    <circle cx="28" cy="20" r="1.8" fill="#FFFFFF"/>

    <!-- Luồng sáng tinh anh nối giữa ngôi sao và trang sách -->
    <line x1="28" y1="26" x2="28" y2="34" stroke="url(#cosmicGradDark)" stroke-width="1.5" stroke-dasharray="2 1.5" opacity="0.8"/>

    <!-- Cuốn sách vũ trụ mở rộng -->
    <!-- Bìa sách ngoài viền neon phát quang -->
    <path d="M 28 46 C 20 42 12 43 5 47 C 5 41 12 36 28 38.5 Z" fill="url(#bookLeftDark)" stroke="#00F0FF" stroke-width="1.2" filter="url(#cosmicGlow)"/>
    <path d="M 28 46 C 36 42 44 43 51 47 C 51 41 44 36 28 38.5 Z" fill="url(#bookRightDark)" stroke="#A855F7" stroke-width="1.2" filter="url(#cosmicGlow)"/>

    <!-- Lớp trang sách huyền bí bên trong -->
    <path d="M 28 44 C 21 40 13 41 7 45 C 7 39 13 34.5 28 37 Z" fill="#080D1A" stroke="#00F0FF" stroke-width="0.8" opacity="0.85"/>
    <path d="M 28 44 C 35 40 43 41 49 45 C 49 39 43 34.5 28 37 Z" fill="#080D1A" stroke="#A855F7" stroke-width="0.8" opacity="0.85"/>

    <!-- Dải ruy băng hoàng kim đánh dấu trang -->
    <polygon points="27,37 29,37 28.5,46 27.5,46" fill="#FDE047" filter="url(#cosmicGlow)"/>
  </g>

  <!-- PHẦN CHỮ TYPOGRAPHY BÊN PHẢI (DÀN NGANG CHUẨN NAVBAR DARK MODE) -->
  <g id="brand-typography-dark">
    <!-- Tên thương hiệu: TRÍ TUỆ BOOK sắc trắng Obsidian -->
    <text x="62" y="32" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18.5" font-weight="800" fill="#F8FAFC" letter-spacing="0.5">TRÍ TUỆ <tspan fill="#38BDF8">BOOK</tspan></text>
    
    <!-- Slogan định vị: TRÍ TUỆ VÔ HẠN sắc xanh ngọc neon -->
    <text x="62.5" y="46.5" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" font-weight="700" fill="#00F0FF" letter-spacing="2.6" opacity="0.95">TRÍ TUỆ VÔ HẠN</text>
  </g>
</svg>
