<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 60" width="100%" height="100%">
  <defs>
    <!-- Ánh sáng mặt trời bình minh tri thức -->
    <linearGradient id="sunGlow" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#EA580C"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FDE047"/>
    </linearGradient>

    <radialGradient id="sunAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FBBF24" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>

    <!-- Bìa sách xanh thanh lịch -->
    <linearGradient id="bookCoverLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>

    <!-- Trang sách chuyển sắc -->
    <linearGradient id="bookPageLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>

    <filter id="lightDropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#4F46E5" flood-opacity="0.16"/>
    </filter>
  </defs>

  <!-- BIỂU TƯỢNG BÊN TRÁI: MẶT TRỜI HÀO QUANG & CUỐN SÁCH KHAI SÁNG -->
  <g id="brand-icon-light" filter="url(#lightDropShadow)">
    <!-- Quầng hào quang mặt trời -->
    <circle cx="28" cy="20" r="14" fill="url(#sunAura)"/>
    
    <!-- Các tia sáng mặt trời chiếu rọi tri thức -->
    <g stroke="url(#sunGlow)" stroke-width="1.8" stroke-linecap="round" opacity="0.95">
      <line x1="28" y1="6" x2="28" y2="2"/>
      <line x1="38" y1="9" x2="42" y2="6"/>
      <line x1="43" y1="20" x2="47" y2="20"/>
      <line x1="18" y1="9" x2="14" y2="6"/>
      <line x1="13" y1="20" x2="9" y2="20"/>
      <line x1="35" y1="13" x2="38" y2="11" stroke-width="1.2" opacity="0.6"/>
      <line x1="21" y1="13" x2="18" y2="11" stroke-width="1.2" opacity="0.6"/>
    </g>

    <!-- Thân vầng thái dương -->
    <circle cx="28" cy="20" r="8.5" fill="url(#sunGlow)"/>
    <circle cx="28" cy="19" r="6" fill="#FFFBEB" opacity="0.55"/>

    <!-- Cuốn sách mở rộng nâng đỡ tri thức -->
    <!-- Bìa sách ngoài -->
    <path d="M 28 46 C 20 42 12 43 5 47 C 5 41 12 36 28 38.5 Z" fill="url(#bookCoverLight)"/>
    <path d="M 28 46 C 36 42 44 43 51 47 C 51 41 44 36 28 38.5 Z" fill="url(#bookCoverLight)"/>

    <!-- Trang sách giữa -->
    <path d="M 28 44 C 21 40 13 41 7 45 C 7 39 13 34.5 28 37 Z" fill="url(#bookPageLight)" stroke="#CBD5E1" stroke-width="0.8"/>
    <path d="M 28 44 C 35 40 43 41 49 45 C 49 39 43 34.5 28 37 Z" fill="url(#bookPageLight)" stroke="#CBD5E1" stroke-width="0.8"/>

    <!-- Lớp giấy trên cùng trắng tinh khôi -->
    <path d="M 28 42 C 22 39 15 40 9 43 C 9 38 14 33 28 35.5 Z" fill="#FFFFFF"/>
    <path d="M 28 42 C 34 39 41 40 47 43 C 47 38 42 33 28 35.5 Z" fill="#FFFFFF"/>

    <!-- Dải ruy băng đánh dấu trang vàng ánh kim -->
    <polygon points="27,35.5 29,35.5 28.5,46 27.5,46" fill="url(#sunGlow)"/>
  </g>

  <!-- PHẦN CHỮ TYPOGRAPHY BÊN PHẢI (DÀN NGANG CHUẨN NAVBAR WEB) -->
  <g id="brand-typography-light">
    <!-- Tên thương hiệu: TRÍ TUỆ BOOK -->
    <text x="62" y="32" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18.5" font-weight="800" fill="#0F172A" letter-spacing="0.5">TRÍ TUỆ <tspan fill="#4F46E5">BOOK</tspan></text>
    
    <!-- Slogan định vị: HÀO QUANG KHAI SÁNG -->
    <text x="62.5" y="46.5" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" font-weight="700" fill="#D97706" letter-spacing="2.6">HÀO QUANG KHAI SÁNG</text>
  </g>
</svg>
